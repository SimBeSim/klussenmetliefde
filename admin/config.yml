backend:
  name: git-gateway          # Netlify Identity + Git Gateway
  branch: main               # pas aan als jouw default anders is

# Concept -> Review -> Publiceren (met 'Unpublished entries' in CMS)
publish_mode: editorial_workflow

media_folder: "img/uploads"  # waar uploads in de repo komen
public_folder: "/img/uploads" # hoe ze publiek bereikbaar zijn

# Slug-instellingen: mooie URL's zonder rare tekens
slug:
  encoding: "unicode"
  clean_accents: true
  sanitize_replacement: "-"

site_url: "https://inquisitive-pie-5c49b6.netlify.app"

# Optioneel: alleen uitgenodigde users mogen inloggen (regel je in Netlify Identity)
# i18n etc. kun je later toevoegen

collections:
  - name: "projecten"
    label: "Projecten"
    label_singular: "Project"
    folder: "projecten"        # elk item wordt een .md bestand in /projecten
    create: true               # maakt nieuwe bestanden aan
    delete: true
    format: "frontmatter"
    extension: "md"
    identifier_field: "title"
    slug: "{{slug}}"           # gebruikt Titel -> slug
    sort:
      field: "date"
      direction: "desc"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Samenvatting", name: "summary", widget: "text", required: false, hint: "Korte intro (kaartweergave/SEO)" }
      - { label: "Categorie", name: "categorie", widget: "select", options: ["Tech", "Manifest", "Film", "Maatschappij", "Boek"], multiple: false, required: false }
      - { label: "Cover", name: "cover", widget: "image", required: false, allow_multiple: false, hint: "Optioneel: kleine thumbnail/visual" }
      - { label: "Inhoud", name: "body", widget: "markdown", hint: "Gebruik Markdown. Koppen (###), lijstjes, links, afbeeldingen." }

  # Voorbeeld extra collectie (later inschakelen als je wilt):
