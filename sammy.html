<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AniFunny bericht 4 Sammy</title>
  <meta name="description" content="Een geanimeerde brief aan Samanta">
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>  
</head>
<body>
  <main class="wrap">
    <section class="card" aria-live="polite">
      <div class="ttl" id="title">AniBrief</div>
      <div class="progress" id="progress" aria-label="Voortgang"></div>
      <div class="stage">
        <div class="stage-inner">
          <div id="text" class="text"></div>
          <div id="htmlbox" class="text" style="display:none"></div>
          <div id="ytbox">
            <div id="ytplayer"></div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="prev" class="btn btn--prev" disabled>◀ Terug</button>
        <button id="next" class="btn btn--next">Verder ▶</button>
      </div>
    </section>
  </main>
</body>
</html>
